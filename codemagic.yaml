workflows:
  ios-unsigned:
    name: 拾刻 iOS 未签名测试包
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: shike_ios
    environment:
      flutter: 3.47.8
      xcode: latest
      cocoapods: default
    # Manual runs only. Do not enable paid billing or automatic rebuild loops.
    scripts:
      - name: Restore dependencies
        script: flutter pub get
      - name: Analyze and test
        script: |
          set -e
          flutter analyze
          flutter test --reporter expanded
          python3 ../tools/test_ios_delivery.py
      - name: Build unsigned device app
        script: flutter build ios --release --no-codesign --target lib/complete_main.dart
      - name: Package unsigned IPA
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/delivery"
          python3 ../tools/ios_delivery.py package --app build/ios/iphoneos/Runner.app --output "$CM_BUILD_DIR/delivery/shike-unsigned.ipa"
          xcodebuild -version > "$CM_BUILD_DIR/delivery/BUILD-INFO.txt"
          flutter --version >> "$CM_BUILD_DIR/delivery/BUILD-INFO.txt"
          git rev-parse HEAD >> "$CM_BUILD_DIR/delivery/BUILD-INFO.txt"
    artifacts:
      - $CM_BUILD_DIR/delivery/shike-unsigned.ipa
      - $CM_BUILD_DIR/delivery/BUILD-INFO.txt
      - /tmp/xcodebuild_logs/*.log
